<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7145d6" />
    <meta name="description" content="Uebit — Crie sites reais de forma visual e com programação em blocos. Tecnologia amigável, criativa e divertida para aprender desenvolvimento web." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link rel="alternate icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <title>Uebit — Sua ideia dá um salto</title>
    <script>
      window.addEventListener('error', (event) => {
        const node = document.createElement('pre')
        node.id = 'smoke-browser-error'
        node.textContent = 'BROWSER ERROR: ' + (event.error?.stack || event.message || event.target?.src || String(event.target))
        document.body.appendChild(node)
      }, true)
      window.addEventListener('unhandledrejection', (event) => {
        const node = document.createElement('pre')
        node.textContent = 'PROMISE ERROR: ' + String(event.reason?.stack || event.reason)
        document.body.appendChild(node)
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
