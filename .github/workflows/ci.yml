name: Testar aulas e editor

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/trilha-10-aulas]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
